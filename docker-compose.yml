services:
  offtap:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      USSD_CODE: ${USSD_CODE:-*384*8822#}
      USSD_WEBHOOK_TOKEN: ${USSD_WEBHOOK_TOKEN:-}
      MAX_PAYMENT_SATS: ${MAX_PAYMENT_SATS:-50000}
      DAILY_LIMIT_SATS: ${DAILY_LIMIT_SATS:-100000}
      SERVER_SECRET: ${SERVER_SECRET:-}
      WALLET_PROVIDER: ${WALLET_PROVIDER:-faucet}
      FAUCET_SATS: ${FAUCET_SATS:-10000}
      SEED_DEMO: ${SEED_DEMO:-}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-}
      ALBY_HUB_URL: ${ALBY_HUB_URL:-http://wallet:8080/api}
      ALBY_HUB_TOKEN: ${ALBY_HUB_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STT_URL: ${STT_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
    volumes:
      - offtap-data:/data
    restart: unless-stopped

  wallet:
    image: ghcr.io/getalby/hub:latest
    profiles: ["wallet"]
    ports:
      - "127.0.0.1:${WALLET_PORT:-8080}:8080"
    environment:
      WORK_DIR: /data
    volumes:
      - wallet-data:/data
    restart: unless-stopped

  speech:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["voice"]
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-small}"]'
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

volumes:
  speech-models:
  offtap-data:
  wallet-data:
